* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: 'Noto Sans Thai', 'Prompt', system-ui, sans-serif;
  background-color: var(--bg);
  background-image: radial-gradient(var(--bg-dot) 1.5px, transparent 1.5px);
  background-size: 20px 20px;
  color: var(--ink);
  font-size: 15px;
  line-height: 1.5;
  transition: background-color .2s, color .2s;
}
h1, h2, h3, .num, .font-head {
  font-family: 'Prompt', 'Noto Sans Thai', system-ui, sans-serif;
  margin: 0;
  font-weight: 700;
  letter-spacing: -0.01em;
}
button, input, select { font: inherit; color: inherit; }

/* Marquee Top Ticker */
.ticker {
  background: var(--lime);
  color: #16161a;
  border-bottom: var(--bw) solid var(--line);
  font-family: 'Prompt', sans-serif;
  font-weight: 700;
  font-size: 13px;
  padding: 6px 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  overflow: hidden;
  white-space: nowrap;
}
.ticker-badges { display: flex; gap: 6px; align-items: center; }
.vibe-btn {
  border: 1.5px solid #16161a;
  background: #fff;
  color: #16161a;
  border-radius: 99px;
  padding: 2px 10px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: transform .12s;
}
.vibe-btn:hover { transform: translateY(-1px); }
.vibe-btn.active { background: #16161a; color: #fff; }

.app { display: flex; min-height: calc(100vh - 36px); }

/* Sidebar */
aside {

  background: var(--side);
  color: var(--side-ink);
  border-right: var(--bw) solid var(--line);

  display: flex;
  flex-direction: column;
  gap: 10px;
  position: sticky;
  top: 0;
  height: 100vh;
  flex-shrink: 0;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 6px 8px 14px;
  border-bottom: 1px dashed rgba(255,255,255,0.18);
}
.logo {
  width: 46px;
  height: 46px;
  border-radius: 14px;
  background: var(--lime);
  color: #16161a;
  border: 2px solid #fff;
  display: grid;
  place-items: center;
  font-size: 24px;
  box-shadow: 3px 3px 0px var(--primary);
  transform: rotate(-4deg);
}
.brand b {
  font-family: 'Prompt', sans-serif;
  font-size: 19px;
  color: #fff;
  letter-spacing: -0.02em;
}
.brand small {
  display: inline-block;
  background: var(--primary);
  color: var(--primary-ink);
  font-size: 11px;
  font-weight: 700;
  padding: 1px 8px;
  border-radius: 99px;
  margin-top: 2px;
}

.who {
  background: var(--side-card);
  border: 1.5px solid rgba(255,255,255,0.16);
  border-radius: 16px;
  padding: 12px;
  font-size: 12px;
}
.who label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-weight: 600;
  color: #cbd5e1;
  text-transform: uppercase;

.who select {

  border: 2px solid var(--lime);

nav { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
nav button {

}
.stat:hover { transform: translate(-2px, -2px); box-shadow: var(--shadow-lg); }
.stat .sticker {
  position: absolute;
  right: 14px;
  top: 14px;
  width: 42px;
  height: 42px;
  border-radius: 12px;
  border: 2px solid var(--line);
  display: grid;
  place-items: center;
  font-size: 20px;
  background: var(--lime);
  color: #16161a;
  transform: rotate(6deg);
}
.stat.b .sticker { background: var(--cyan); transform: rotate(-6deg); }
.stat.r .sticker { background: #ffccd5; transform: rotate(8deg); }
.stat.g .sticker { background: var(--gold); transform: rotate(-4deg); }
.stat small {
  color: var(--mute);
  font-weight: 600;
  font-size: 13px;
  display: block;
}
.stat .num {

  line-height: 1.15;
  margin-top: 6px;
}
.stat .sub {

  font-weight: 600;
  margin-top: 6px;
  display: inline-block;
  padding: 2px 8px;

  background: var(--soft-line);
}

/* Cards */
.card {
  background: var(--card);
  border: var(--bw) solid var(--line);
  border-radius: 22px;
  padding: 20px 22px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}
.card-title {

  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.card h2 { font-size: 19px; display: flex; align-items: center; gap: 8px; }

/* Tables */
.wrap { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; }
.tbl th {
  text-align: left;
  font-weight: 700;
  color: var(--mute);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.04em;

}
.tbl td {

}
.tbl tr:hover td { background: rgba(139, 92, 246, 0.04); }
.tbl tr:last-child td { border-bottom: 0; }
.r- { text-align: right; }

.item-cell {

  align-items: center;
  gap: 10px;
}
.item-ico {

  height: 38px;
  border-radius: 12px;
  border: 1.5px solid var(--line);
  background: var(--bg);
  display: grid;
  place-items: center;
  font-size: 19px;
  flex-shrink: 0;
}

/* Pills */
.pill {

  align-items: center;
  gap: 5px;
  padding: 4px 12px;
  border-radius: 99px;
  font-size: 12px;
  font-weight: 700;
  border: 1.5px solid var(--line);
  white-space: nowrap;
  box-shadow: 1.5px 1.5px 0px var(--line);
}
.p-ok { background: var(--pill-ok); color: var(--pill-ok-ink); }
.p-wait { background: var(--pill-wait); color: var(--pill-wait-ink); }
.p-no { background: var(--pill-no); color: var(--pill-no-ink); }

/* Buttons */
.btn {
  border: var(--bw) solid var(--line);
  border-radius: 14px;
  padding: 10px 18px;
  cursor: pointer;
  font-weight: 700;
  background: var(--primary);
  color: var(--primary-ink);
  box-shadow: var(--shadow-sm);
  transition: transform .12s ease, box-shadow .12s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn:hover {
  transform: translate(-2px, -2px);
  box-shadow: var(--shadow);
}
.btn:active {
  transform: translate(1px, 1px);
  box-shadow: none;
}
.btn.s { padding: 6px 13px; font-size: 13px; border-radius: 11px; }
.btn.o { background: var(--card); color: var(--ink); }
.btn.d { background: var(--red); color: #fff; }
.btn.gold { background: var(--lime); color: #16161a; }

/* Inputs & Filter Chips */
input[type=text], input[type=number], input[type=search], select.f {
  padding: 10px 14px;
  border-radius: 14px;
  border: var(--bw) solid var(--line);
  background: var(--bg);
  color: var(--ink);

  font-weight: 500;
}
input[type=number] { width: 96px; text-align: right; font-weight: 700; }
input:focus, select:focus { outline: 3px solid var(--primary); outline-offset: 1px; }

.tools {

  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 12px;
  align-items: center;

.chip-bar {

  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 14px;

.chip {
  border: 1.5px solid var(--line);
  background: var(--bg);
  color: var(--ink);
  border-radius: 99px;
  padding: 6px 14px;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  transition: all .12s;
}
.chip:hover { transform: translateY(-1px); }
.chip.on {
  background: var(--lime);
  color: #16161a;
  box-shadow: var(--shadow-sm);
}

/* Progress Bar */
.bar {
  height: 12px;
  border-radius: 99px;
  background: var(--soft-line);
  border: 1.5px solid var(--line);
  overflow: hidden;
  min-width: 90px;
}
.bar i { display: block; height: 100%; background: var(--teal); transition: width .3s; }
.bar.low i { background: var(--red); }

.cat {
  font-family: 'Prompt', sans-serif;
  font-size: 15px;
  font-weight: 700;
  padding: 10px 12px !important;
  background: var(--soft-line);
  border-radius: 10px;
}

/* Flow Steps */
.flow {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  font-size: 13px;
  font-weight: 700;

.flow b {
  background: var(--bg);
  border: 1.5px solid var(--line);
  padding: 6px 12px;
  border-radius: 12px;
  box-shadow: var(--shadow-sm);
}

/* Modal & Toast */
.modal {
  position: fixed;
  inset: 0;
  background: rgba(10, 12, 20, .65);
  backdrop-filter: blur(4px);
  display: grid;
  place-items: center;
  padding: 16px;
  z-index: 50;
}
.box {
  background: var(--card);
  border: 3px solid var(--line);
  border-radius: 24px;
  padding: 24px;
  width: min(580px, 100%);
  max-height: 88vh;
  overflow: auto;
  box-shadow: 8px 8px 0px var(--primary);
  animation: pop .18s cubic-bezier(0.34, 1.56, 0.64, 1);
}
@keyframes pop { from { transform: scale(.92) translateY(8px); opacity: 0; } }
.row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }

.toast {
  position: fixed;
  left: 50%;
  bottom: 26px;
  transform: translateX(-50%);
  background: #16161a;
  color: #fff;
  border: 2px solid var(--lime);
  padding: 12px 22px;
  border-radius: 99px;
  font-weight: 700;
  z-index: 99;
  box-shadow: 4px 4px 0px var(--primary);
  animation: pop .2s ease;
}
.empty {
  text-align: center;
  color: var(--mute);
  padding: 34px 12px;
  font-weight: 600;
  font-size: 16px;
}
.low { color: var(--red); font-weight: 800; }

/* Confetti Burst */
.confetti {
  position: fixed;
  pointer-events: none;
  z-index: 120;
  font-size: 22px;
  animation: fly 1s ease-out forwards;
}
@keyframes fly {
  0% { transform: translate(0, 0) scale(1) rotate(0deg); opacity: 1; }
  100% { transform: translate(var(--tx), var(--ty)) scale(0.4) rotate(260deg); opacity: 0; }
}

@media (max-width: 860px) {
  .app { flex-direction: column; }
  aside {
    width: 100%;
    height: auto;
    position: sticky;
    top: 0;
    z-index: 20;
    padding: 12px;
    flex-direction: row;
    flex-wrap: wrap;
    align-items: center;
  }
  .brand { border: 0; padding: 0; }
  .brand span { display: none; }
  .who { flex: 1; padding: 6px 10px; }
  .who label { display: none; }
  .who select { margin: 0; }
  .side-footer { display: none; }
  nav { flex-direction: row; overflow-x: auto; width: 100%; margin-top: 6px; }
  nav button { white-space: nowrap; padding: 8px 12px; font-size: 13px; }
  main { padding: 18px 14px 60px; }
}
</style>

function burstConfetti() {

    var el = document.createElement('div');

    el.textContent = emojis[i % emojis.length];
    el.style.left = (window.innerWidth / 2 + (Math.random() * 80 - 40)) + 'px';
    el.style.top = (window.innerHeight / 2) + 'px';
    el.style.setProperty('--tx', (Math.random() * 360 - 180) + 'px');
    el.style.setProperty('--ty', (Math.random() * -280 - 40) + 'px');
    document.body.appendChild(el);

  }
}

  modal('<h2>💌 ยืนยันส่งใบเบิกของ?</h2><div class="wrap"><table class="tbl">' + cartN().map(function(k) {
    var p = pr(+k);
    return '<tr><td>' + p.ico + ' ' + p.name + '</td><td class="r-" style="font-weight:800">' + cart[k] + ' ' + p.unit + '</td></tr>';
  }).join('') + '</table></div><br><label style="font-weight:700">โน้ตฝากบอกคลังกลาง 💬<input id="nt" type="text" style="margin-top:6px" placeholder="เช่น ของหมดเชลฟ์แล้วแม่ ขอไวๆ พลีสสส 🔥"></label>'
    + '<div class="row"><button class="btn o" onclick="closeM()">แก้แป๊บ</button><button class="btn" onclick="sendReq()">🚀 กดส่งใบเบิกเลย!</button></div>');
}
function sendReq() {
  var items = cartN().map(function(k) { return { pid: +k, q: cart[k] }; });
  S.reqs.unshift({ id: S.nid++, br: role, date: dt(0), items: items, status: 'wait', note: $('nt').value });
  logit('💌 ' + BR[role] + ' ส่งใบเบิก ' + items.length + ' รายการ');
  cart = {}; save(); closeM(); burstConfetti(); toast('🚀 ส่งใบเบิกแล้ว! รอคลังกลางเคาะอนุมัติ'); tab = 'reqs'; render();
}

// ---------- requests list
function reqRows(rs) {
  if (!rs.length) return '<div class="empty">✨ ยังไม่มีรายการใบเบิกเลยจ้า</div>';
  return '<div class="wrap"><table class="tbl"><tr><th>เลขใบเบิก</th><th>วันที่</th>' + (isC() ? '<th>จากสาขา</th>' : '') + '<th>จำนวน</th><th>สถานะ</th><th>หมายเหตุ</th><th></th></tr>' + rs.map(function(r) {
    return '<tr><td><b>#' + String(r.id).padStart(4, '0') + '</b></td><td>' + fmt(r.date) + '</td>' + (isC() ? '<td><b>' + BR[r.br] + '</b></td>' : '') + '<td>' + r.items.length + ' รายการ</td><td>' + st(r.status) + '</td><td style="color:var(--mute);max-width:200px">' + (r.note ? esc(r.note) : '-') + '</td><td class="r-"><button class="btn s ' + (isC() && r.status === 'wait' ? 'gold' : 'o') + '" onclick="viewReq(' + r.id + ')">' + (isC() && r.status === 'wait' ? '⚡ พิจารณาด่วน' : '👀 ส่องรายละเอียด') + '</button></td></tr>';
  }).join('') + '</table></div>';
}
function reqs() {
  var rs = isC() ? S.reqs : S.reqs.filter(function(r) { return r.br === role; });
  return head(
    '💌 REQUISITION HUB',
    isC() ? 'กล่องใบเบิกจากทุกสาขา' : 'ใบเบิกของฉัน (' + BR[role] + ')',
    isC() ? 'กดอนุมัติปุ๊บ ตัดสต็อกคลังกลาง + เติมเข้าสาขาให้ออโต้แบบสับ!' : 'เช็กสถานะใบเบิกที่ส่งไปหาคลังกลางแบบเรียลไทม์',
    isC() ? '' : '<button class="btn" onclick="go(\'new\')">+ สร้างใบเบิกใหม่</button>'
  ) + '<div class="card">' + reqRows(rs) + '</div>';
}

function viewReq(id) {
  var r = S.reqs.find(function(x) { return x.id === id; }), w = r.status === 'wait' && isC();
  var h = '<h2>ใบเบิก #' + String(r.id).padStart(4, '0') + ' ' + st(r.status) + '</h2>'
    + '<p style="color:var(--mute);font-weight:600">📍 ' + BR[r.br] + ' · 📅 ' + fmt(r.date) + (r.note ? '<br>💬 โน้ตจากสาขา: "' + esc(r.note) + '"' : '') + '</p>';
  h += '<div class="wrap"><table class="tbl"><tr><th>สินค้า</th><th class="r-">ขอเบิก</th>' + (w ? '<th class="r-">คลังกลางมี</th><th class="r-">เคาะอนุมัติ</th>' : '<th class="r-">ได้จริง</th>') + '</tr>'
    + r.items.map(function(i, n) {
        var p = pr(i.pid);
        return '<tr><td>' + p.ico + ' <b>' + p.name + '</b></td><td class="r-">' + i.q + ' ' + p.unit + '</td>'
          + (w ? '<td class="r- ' + (p.stock.C < i.q ? 'low' : '') + '">' + p.stock.C + '</td><td class="r-"><input type="number" min="0" max="' + Math.min(i.q, p.stock.C) + '" value="' + Math.min(i.q, p.stock.C) + '" id="ap' + n + '"></td>'
               : '<td class="r-" style="font-weight:800">' + (r.status === 'ok' ? (i.a != null ? i.a : i.q) + ' ' + p.unit : '-') + '</td>') + '</tr>';
      }).join('') + '</table></div>';
  h += '<div class="row">' + (w ? '<button class="btn o" onclick="closeM()">ปิด</button><button class="btn d" onclick="decide(' + id + ',false)">❌ ปัดตก (ไม่อนุมัติ)</button><button class="btn gold" onclick="decide(' + id + ',true)">✅ อนุมัติฉ่ำ & ตัดสต็อกเลย!</button>' : '<button class="btn o" onclick="closeM()">ปิดหน้าต่าง</button>') + '</div>';
  modal(h);
}

function decide(id, ok) {
  var r = S.reqs.find(function(x) { return x.id === id; });
  if (!ok) {
    r.status = 'no';
    logit('❌ ปัดตกใบเบิก #' + r.id + ' ของ ' + BR[r.br]);
    save(); closeM(); toast('บันทึกปัดตกใบเบิกแล้ว'); render(); return;
  }
  var a = r.items.map(function(i, n) { var v = parseInt($('ap' + n).value, 10); return isNaN(v) ? 0 : v; });
  for (var n = 0; n < a.length; n++) {
    var p = pr(r.items[n].pid);
    if (a[n] < 0 || a[n] > r.items[n].q) { toast('⚠️ อนุมัติเกินจำนวนที่สาขาขอ: ' + p.name); return; }
    if (a[n] > p.stock.C) { toast('🚨 ของในคลังกลางไม่พอจ่าย: ' + p.name); return; }
  }
  if (!a.some(function(v) { return v > 0; })) { toast('⚠️ ถ้าอนุมัติเป็น 0 หมด กดปุ่ม "ปัดตก" แทนได้เลยจ้า'); return; }
  r.items.forEach(function(i, n) {
    var p = pr(i.pid);
    i.a = a[n];
    p.stock.C -= a[n];
    p.stock[r.br] += a[n];
  });
  r.status = 'ok';
  logit('✅ อนุมัติใบเบิก #' + r.id + ' ให้ ' + BR[r.br] + ' (ตัดสต็อกออโต้แล้ว)');
  save(); closeM(); burstConfetti(); toast('🎉 อนุมัติฉ่ำ! ตัดสต็อกคลังกลางส่งเข้าสาขาเรียบร้อย'); render();
}

// ---------- log
function logv() {
  return head('📜 ACTIVITY TIMELINE', 'ไทม์ไลน์ประวัติแบบเรียลไทม์', 'บันทึกครบทุกมูฟเมนต์ ใครเบิก ใครเคาะ ใครเติมของ เช็กได้หมด', '<button class="btn o" onclick="resetAll()">🔄 รีเซ็ตข้อมูลกลับค่าเริ่มต้น</button>')
    + '<div class="card">' + (S.log.length ? '<table class="tbl">' + S.log.map(function(l) {
        var d = new Date(l.t);
        return '<tr><td style="white-space:nowrap;color:var(--mute);font-weight:600">' + d.toLocaleString('th-TH', { dateStyle: 'short', timeStyle: 'short' }) + '</td><td style="font-weight:600">' + esc(l.m) + '</td></tr>';
      }).join('') + '</table>' : '<div class="empty">✨ ยังไม่มีประวัติใหม่ ลองกดรับของเข้าคลังหรืออนุมัติใบเบิกดูสิ!</div>') + '</div>';
}

function resetAll() {
  modal('<h2>🔄 รีเซ็ตข้อมูลทั้งหมด?</h2><p>ข้อมูลสต็อกและใบเบิกจะกลับไปเป็นข้อมูลตัวอย่างเริ่มต้นทั้งหมดเลยนะ</p><div class="row"><button class="btn o" onclick="closeM()">ยกเลิก</button><button class="btn d" onclick="S=JSON.parse(JSON.stringify(SEED));save();closeM();toast(\'✨ รีเซ็ตข้อมูลใหม่เอี่ยมแล้ว!\');render()">ยืนยันรีเซ็ต</button></div>');
}

render();
</script>
</body>
</html>
